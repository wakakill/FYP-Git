# Calm light-slate theme for app.py
[theme]
base = "light"
primaryColor = "#3A6EA5"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E293B"
borderColor = "#E3E8EF"
baseRadius = "12px"
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#F1F5F9"
# Inter from Google Fonts (falls back to the default sans-serif font when offline)
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
redColor = "#E05A5A"
orangeColor = "#E8894A"
yellowColor = "#E0B04A"
greenColor = "#3FA27F"
blueColor = "#3A6EA5"
grayColor = "#94A3B8"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"

[browser]
# Offline tool: do not send usage statistics
gatherUsageStats = false
