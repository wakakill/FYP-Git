# Slide 18 light-slate theme for app.py
[theme]
base = "light"
primaryColor = "#1E3A5F"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E293B"
borderColor = "#E2E8F0"
baseRadius = "10px"
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#F1F5F9"
redColor = "#EF4444"
orangeColor = "#F97316"
yellowColor = "#F59E0B"
greenColor = "#10B981"
blueColor = "#2563EB"
grayColor = "#94A3B8"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"

[browser]
# Offline tool: do not send usage statistics
gatherUsageStats = false

[client]
# Hide developer menu items for a cleaner page
toolbarMode = "minimal"
